[package]
name = "nova_core"
version = "0.1.0"
edition = "2021"
description = "🚀 Nova Core - Post-Transformer LLM without attention, tokens, or layers"
authors = ["Nova Developer"]
license = "MIT"

[dependencies]
# CLI and user interaction
clap = { version = "4.4", features = ["derive", "color"] }
colored = "2.0"

# Math and randomness
rand = "0.8"
rayon = "1.7"          # Parallel processing

# Serialization (for .nova format)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Regex for dataset filtering
regex-lite = "0.1"

# Terminal UI (will add later)
# ratatui = "0.26"
# crossterm = "0.27"

[profile.release]
opt-level = 3          # Maximum optimization
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
# Auto-vectorization with SIMD (AVX2, FMA, SSE4.2)
# NOTE: For SIMD, build with: RUSTFLAGS="-C target-cpu=native" cargo build --release
# Or create .cargo/config.toml with:
#   [build]
#   rustflags = ["-C", "target-cpu=native"]

[profile.dev]
opt-level = 0          # Fast compilation for development

[[bin]]
name = "nova"
path = "src/main.rs"